<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Admin — Desa Semparuk</title>


  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  >


  <style>

    :root{

      --white:#ffffff;

      --sky-50:#f4f9ff;

      --sky-100:#e8f3fe;

      --sky-200:#d5eafd;

      --blue-400:#5da5e8;

      --blue-500:#3a87d8;

      --blue-600:#256bb8;

      --text:#26384a;

      --muted:#718096;

    }


    *{
      box-sizing:border-box;
    }


    body{

      margin:0;

      min-height:100vh;

      padding:24px;

      display:flex;

      align-items:center;

      justify-content:center;

      background:
        radial-gradient(
          circle at top left,
          var(--sky-100),
          transparent 40%
        ),
        var(--sky-50);

      color:var(--text);

      font-family:'Inter',sans-serif;

    }


    .login-wrap{

      width:100%;

      max-width:430px;

    }


    .brand{

      text-align:center;

      margin-bottom:24px;

    }


    .brand-number{

      display:block;

      margin-bottom:8px;

      color:var(--blue-400);

      font-family:'IBM Plex Mono',monospace;

      font-size:11px;

      letter-spacing:1px;

    }


    .brand h1{

      margin:0;

      color:var(--blue-600);

      font-family:'Fraunces',serif;

      font-size:36px;

      font-weight:600;

    }


    .brand p{

      margin:8px 0 0;

      color:var(--muted);

      font-size:14px;

    }


    .login-card{

      padding:30px;

      background:rgba(255,255,255,.94);

      border:1px solid var(--sky-200);

      border-radius:24px;

      box-shadow:
        0 18px 45px rgba(37,107,184,.10);

    }


    .card-title{

      margin-bottom:24px;

    }


    .card-title h2{

      margin:0 0 6px;

      color:var(--blue-600);

      font-family:'Fraunces',serif;

      font-size:25px;

    }


    .card-title p{

      margin:0;

      color:var(--muted);

      font-size:13px;

      line-height:1.6;

    }


    /*
      Apps Script login iframe
    */

    #loginFrame{

      display:block;

      width:100%;

      height:230px;

      border:0;

      background:white;

    }


    .back{

      display:block;

      margin-top:10px;

      color:var(--muted);

      text-align:center;

      text-decoration:none;

      font-size:12px;

    }


    .back:hover{

      color:var(--blue-600);

    }


    @media(max-width:480px){

      body{

        padding:18px;

      }


      .login-card{

        padding:24px;

        border-radius:20px;

      }


      .brand h1{

        font-size:31px;

      }

    }

  </style>

</head>


<body>


  <main class="login-wrap">


    <div class="brand">

      <span class="brand-number">
        ADMIN · 06
      </span>


      <h1>
        Desa Semparuk
      </h1>


      <p>
        Panel pengelolaan website desa
      </p>

    </div>


    <section class="login-card">


      <div class="card-title">

        <h2>
          Masuk sebagai Admin
        </h2>


        <p>
          Silakan masukkan akun admin untuk melanjutkan.
        </p>

      </div>


      <iframe
        id="loginFrame"
        src="https://script.google.com/macros/s/AKfycbyBFvYCEiIUC1S9t7jKcaav6xk0kthdHNKhEvwhRMbQl7oLGxrtjNQ9GLxC9vYx36rv/exec"
        title="Login Admin"
      ></iframe>


      <a
        href="index.html"
        class="back"
      >
        ← Kembali ke website
      </a>


    </section>


  </main>


  <script>

    window.addEventListener(
      "message",
      function(event){

        const data = event.data;


        if(
          data &&
          data.type === "ADMIN_LOGIN" &&
          data.success === true
        ){

          sessionStorage.setItem(
            "adminLoggedIn",
            "true"
          );


          window.location.href =
            "dashboard.html";

        }

      }
    );

  </script>


</body>

</html>
