<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Detail Pengaduan — Semparuk Sutera</title>

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- FONT AWESOME -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <style>
      /* =====================================================
         DESIGN SYSTEM — SEMPARUK SUTERA
      ===================================================== */

      :root {
        --white: #ffffff;

        --sky-50: #f4f9ff;
        --sky-100: #e8f3fe;
        --sky-200: #d5eafd;
        --sky-300: #b7dcfb;

        --blue-300: #8ec4f2;
        --blue-400: #5da5e8;
        --blue-500: #3a87d8;
        --blue-600: #256bb8;
        --blue-700: #175496;
        --blue-800: #123f73;
        --blue-900: #0c3158;

        --ink: #0c2846;
        --ink-soft: #4c6680;
        --ink-mut: #5c7793;

        --card: #ffffff;
        --soft: #f8fbff;

        --border: rgba(58, 135, 216, 0.14);

        --shadow-blue:
          0 18px 40px -14px rgba(37, 107, 184, 0.35);

        --shadow-blue-sm:
          0 8px 20px -8px rgba(37, 107, 184, 0.3);

        --ring:
          0 0 0 1px rgba(58, 135, 216, 0.14);
      }

      /* =====================================================
         DARK MODE
      ===================================================== */

      body.dark {
        --sky-50: #081a2c;
        --sky-100: #0d243b;
        --sky-200: #163653;
        --sky-300: #245174;

        --white: #10263c;
        --card: #10263c;
        --soft: #0d2135;

        --ink: #edf7ff;
        --ink-soft: #a9bfd2;
        --ink-mut: #8ca7bf;

        --border: rgba(142, 196, 242, 0.15);

        --shadow-blue:
          0 18px 40px -14px rgba(0, 0, 0, 0.45);

        --shadow-blue-sm:
          0 8px 20px -8px rgba(0, 0, 0, 0.35);
      }

      /* =====================================================
         RESET
      ===================================================== */

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: "Inter", sans-serif;
        background: var(--sky-50);
        color: var(--ink);
        min-height: 100vh;
        overflow-x: hidden;
        transition:
          background 0.3s ease,
          color 0.3s ease;
      }

      button,
      input,
      textarea,
      select {
        font-family: inherit;
      }

      a {
        color: inherit;
      }

      /* =====================================================
         AMBIENT BACKGROUND
      ===================================================== */

      .ambient {
        position: fixed;
        inset: 0;
        z-index: -2;
        pointer-events: none;
        overflow: hidden;
      }

      .ambient::before,
      .ambient::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.5;
      }

      .ambient::before {
        width: 430px;
        height: 430px;
        background: rgba(93, 165, 232, 0.18);
        top: -180px;
        right: -100px;
      }

      .ambient::after {
        width: 390px;
        height: 390px;
        background: rgba(183, 220, 251, 0.22);
        bottom: -180px;
        left: -100px;
      }

      .ambient-grid {
        position: absolute;
        inset: 0;

        background-image:
          linear-gradient(
            rgba(58, 135, 216, 0.035) 1px,
            transparent 1px
          ),
          linear-gradient(
            90deg,
            rgba(58, 135, 216, 0.035) 1px,
            transparent 1px
          );

        background-size: 50px 50px;

        mask-image: linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.65),
          transparent 80%
        );
      }

      /* =====================================================
         TOPBAR
      ===================================================== */

      .topbar {
        position: fixed;

        top: 16px;
        left: 18px;
        right: 18px;

        max-width: 1250px;

        margin: auto;

        height: 68px;

        z-index: 1000;

        display: flex;
        align-items: center;
        justify-content: space-between;

        padding: 8px 10px 8px 20px;

        background: rgba(255, 255, 255, 0.86);

        border: 1px solid rgba(58, 135, 216, 0.16);

        border-radius: 22px;

        box-shadow:
          0 16px 35px -18px rgba(23, 84, 150, 0.28),
          0 0 0 1px rgba(255, 255, 255, 0.6);

        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
      }

      body.dark .topbar {
        background: rgba(16, 38, 60, 0.88);

        border-color: rgba(142, 196, 242, 0.14);

        box-shadow:
          0 18px 40px -20px rgba(0, 0, 0, 0.65);
      }

      /* =====================================================
         BRAND
      ===================================================== */

      .brand {
        flex-shrink: 0;

        display: flex;
        flex-direction: column;

        font-family: "Fraunces", serif;

        font-size: 19px;

        font-weight: 700;

        line-height: 1;

        letter-spacing: -0.3px;

        color: var(--blue-800);

        text-decoration: none;
      }

      body.dark .brand {
        color: #eaf5ff;
      }

      .brand small {
        margin-top: 5px;

        font-family: "IBM Plex Mono", monospace;

        font-size: 7px;

        font-weight: 500;

        letter-spacing: 1.4px;

        text-transform: uppercase;

        color: var(--ink-mut);
      }

      /* =====================================================
         NAVIGATION
      ===================================================== */

      .chapters {
        position: relative;

        display: flex;
        align-items: center;

        gap: 2px;

        margin-left: auto;
        margin-right: 12px;
      }

      .chapters > a {
        position: relative;

        z-index: 1;

        padding: 10px 12px;

        white-space: nowrap;

        font-size: 11px;

        font-weight: 600;

        color: var(--blue-700);

        text-decoration: none;

        display: flex;
        align-items: center;

        gap: 6px;

        border-radius: 999px;

        transition:
          color 0.25s ease,
          background 0.25s ease,
          transform 0.25s ease;
      }

      body.dark .chapters > a {
        color: #b9d7ee;
      }

      .chapters > a .n {
        font-family: "IBM Plex Mono", monospace;

        font-size: 8px;

        opacity: 0.55;

        font-weight: 400;
      }

      .chapters > a:hover {
        color: var(--blue-600);

        background: rgba(232, 243, 254, 0.75);

        transform: translateY(-1px);
      }

      body.dark .chapters > a:hover {
        background: rgba(93, 165, 232, 0.12);
        color: #ffffff;
      }

      /* =====================================================
         ACTIVE ADMIN
      ===================================================== */

      .nav-admin.active {
        color: #ffffff !important;

        background:
          linear-gradient(
            135deg,
            var(--blue-500),
            var(--blue-700)
          );

        box-shadow: var(--shadow-blue-sm);
      }

      .nav-admin.active:hover {
        color: #ffffff !important;

        background:
          linear-gradient(
            135deg,
            var(--blue-500),
            var(--blue-700)
          );

        transform: translateY(-1px);
      }

      /* =====================================================
         COMPLAINT NAV
      ===================================================== */

      .nav-complaint {
        color: var(--blue-700) !important;
      }

      body.dark .nav-complaint {
        color: #b9d7ee !important;
      }

      .nav-complaint:hover {
        color: var(--blue-600) !important;
      }

      /* =====================================================
         CTA
      ===================================================== */

      .nav-cta {
        flex-shrink: 0;

        border: 0;

        padding: 11px 15px;

        border-radius: 999px;

        display: inline-flex;
        align-items: center;
        gap: 7px;

        background:
          linear-gradient(
            135deg,
            var(--blue-500),
            var(--blue-700)
          );

        color: #ffffff;

        font-size: 11px;
        font-weight: 700;

        cursor: pointer;

        box-shadow: var(--shadow-blue-sm);

        transition:
          transform 0.25s ease,
          box-shadow 0.25s ease;
      }

      .nav-cta:hover {
        transform: translateY(-2px);

        box-shadow: var(--shadow-blue);
      }

      .nav-cta .arrow {
        font-size: 14px;
        line-height: 1;
      }

      /* =====================================================
         THEME BUTTON
      ===================================================== */

      .theme-btn {
        width: 38px;
        height: 38px;

        flex-shrink: 0;

        margin-left: 7px;

        border: 1px solid var(--border);

        border-radius: 50%;

        background: var(--sky-100);

        color: var(--blue-700);

        display: flex;
        align-items: center;
        justify-content: center;

        cursor: pointer;

        transition:
          background 0.25s ease,
          transform 0.25s ease,
          color 0.25s ease;
      }

      .theme-btn:hover {
        background: var(--sky-200);

        transform: rotate(12deg);
      }

      body.dark .theme-btn {
        background: rgba(93, 165, 232, 0.13);
        color: #d8ecff;
      }

      /* =====================================================
         MOBILE MENU
      ===================================================== */

      .menu-btn {
        display: none;

        width: 40px;
        height: 40px;

        border: 1px solid var(--border);

        border-radius: 50%;

        background: var(--sky-100);

        color: var(--blue-700);

        cursor: pointer;
      }

      body.dark .menu-btn {
        background: rgba(93, 165, 232, 0.12);
        color: #d8ecff;
      }

      /* =====================================================
         MAIN PAGE
      ===================================================== */

      .page {
        max-width: 1120px;

        margin: auto;

        padding: 125px 25px 70px;
      }

      /* =====================================================
         BREADCRUMB
      ===================================================== */

      .breadcrumb {
        display: flex;
        align-items: center;
        flex-wrap: wrap;

        gap: 9px;

        margin-bottom: 20px;

        font-family: "IBM Plex Mono", monospace;

        font-size: 10px;

        color: var(--ink-mut);
      }

      .breadcrumb a {
        color: var(--blue-600);

        text-decoration: none;

        transition: color 0.2s ease;
      }

      .breadcrumb a:hover {
        color: var(--blue-800);
      }

      .breadcrumb i {
        font-size: 8px;

        opacity: 0.5;
      }

      /* =====================================================
         PAGE HEADER
      ===================================================== */

      .page-header {
        margin-bottom: 30px;

        max-width: 760px;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 7px;

        margin-bottom: 11px;

        font-family: "IBM Plex Mono", monospace;

        font-size: 9px;

        font-weight: 600;

        letter-spacing: 1.3px;

        text-transform: uppercase;

        color: var(--blue-600);
      }

      .eyebrow::before {
        content: "";

        width: 22px;
        height: 1px;

        background: var(--blue-400);
      }

      .page-header h1 {
        font-family: "Fraunces", serif;

        font-size: clamp(38px, 5vw, 58px);

        line-height: 0.98;

        letter-spacing: -2px;

        font-weight: 600;

        margin-bottom: 14px;

        color: var(--ink);
      }

      .page-header h1 span {
        background:
          linear-gradient(
            135deg,
            var(--blue-500),
            var(--blue-800)
          );

        -webkit-background-clip: text;
        background-clip: text;

        color: transparent;
      }

      .page-header p {
        color: var(--ink-soft);

        font-size: 14px;

        line-height: 1.7;

        max-width: 620px;
      }

      /* =====================================================
         CARD
      ===================================================== */

      .card {
        background: var(--card);

        border: 1px solid var(--border);

        border-radius: 24px;

        box-shadow: var(--shadow-blue);

        overflow: hidden;
      }

      .card-header {
        padding: 23px 28px;

        border-bottom: 1px solid var(--border);

        display: flex;
        align-items: center;
        justify-content: space-between;

        gap: 20px;

        background:
          linear-gradient(
            135deg,
            rgba(232, 243, 254, 0.65),
            rgba(255, 255, 255, 0.4)
          );
      }

      body.dark .card-header {
        background:
          linear-gradient(
            135deg,
            rgba(93, 165, 232, 0.08),
            rgba(16, 38, 60, 0.4)
          );
      }

      .card-header h2 {
        font-family: "Fraunces", serif;

        font-size: 21px;

        font-weight: 600;

        color: var(--ink);
      }

      .card-header h2 span {
        font-family: "IBM Plex Mono", monospace;

        font-size: 11px;

        font-weight: 500;

        color: var(--blue-600);
      }

      .card-body {
        padding: 30px;
      }

      /* =====================================================
         STATUS
      ===================================================== */

      .status {
        display: inline-flex;
        align-items: center;
        gap: 7px;

        padding: 8px 13px;

        border-radius: 999px;

        font-family: "IBM Plex Mono", monospace;

        font-size: 10px;

        font-weight: 600;

        text-transform: capitalize;

        white-space: nowrap;
      }

      .status::before {
        content: "";

        width: 6px;
        height: 6px;

        border-radius: 50%;

        background: currentColor;
      }

      .status-baru {
        color: #176fa9;
        background: #e5f4ff;
      }

      .status-diproses {
        color: #a86d00;
        background: #fff3d5;
      }

      .status-selesai {
        color: #13794d;
        background: #e3f7ed;
      }

      .status-ditolak {
        color: #c53d50;
        background: #ffe8ec;
      }

      /* =====================================================
         INFO GRID
      ===================================================== */

      .info-grid {
        display: grid;

        grid-template-columns: repeat(2, minmax(0, 1fr));

        gap: 14px;

        margin-bottom: 32px;
      }

      .info-item {
        position: relative;

        padding: 18px;

        border-radius: 17px;

        background: var(--soft);

        border: 1px solid var(--border);

        transition:
          transform 0.25s ease,
          border-color 0.25s ease,
          box-shadow 0.25s ease;
      }

      .info-item:hover {
        transform: translateY(-2px);

        border-color: rgba(58, 135, 216, 0.25);

        box-shadow: var(--shadow-blue-sm);
      }

      .info-label {
        margin-bottom: 7px;

        font-family: "IBM Plex Mono", monospace;

        font-size: 9px;

        text-transform: uppercase;

        letter-spacing: 0.8px;

        color: var(--ink-mut);

        font-weight: 500;
      }

      .info-value {
        font-size: 14px;

        font-weight: 650;

        color: var(--ink);

        word-break: break-word;

        line-height: 1.5;
      }

      .info-value a {
        color: var(--blue-600);

        text-decoration: none;
      }

      .info-value a:hover {
        text-decoration: underline;
      }

      /* =====================================================
         CONTENT SECTION
      ===================================================== */

      .content-section {
        margin-top: 28px;
      }

      .section-title {
        display: flex;
        align-items: center;
        gap: 9px;

        margin-bottom: 12px;

        font-family: "IBM Plex Mono", monospace;

        font-size: 10px;

        font-weight: 600;

        letter-spacing: 0.3px;

        text-transform: uppercase;

        color: var(--ink-soft);
      }

      .section-title i {
        width: 28px;
        height: 28px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 9px;

        background: var(--sky-100);

        color: var(--blue-600);

        font-size: 11px;
      }

      .complaint-title {
        font-family: "Fraunces", serif;

        font-size: clamp(24px, 3vw, 31px);

        font-weight: 600;

        line-height: 1.2;

        letter-spacing: -0.5px;

        color: var(--ink);

        margin-bottom: 12px;
      }

      .complaint-content {
        background: var(--soft);

        border: 1px solid var(--border);

        border-radius: 17px;

        padding: 20px;

        font-size: 14px;

        line-height: 1.85;

        white-space: pre-wrap;

        word-break: break-word;

        color: var(--ink-soft);
      }

      /* =====================================================
         LOCATION
      ===================================================== */

      .location {
        display: flex;
        align-items: flex-start;

        gap: 11px;

        padding: 17px;

        background: var(--soft);

        border: 1px solid var(--border);

        border-radius: 17px;

        font-size: 14px;

        line-height: 1.6;

        color: var(--ink-soft);
      }

      .location i {
        flex-shrink: 0;

        width: 28px;
        height: 28px;

        display: flex;
        align-items: center;
        justify-content: center;

        margin-top: 0;

        border-radius: 9px;

        background: var(--sky-100);

        color: var(--blue-600);

        font-size: 11px;
      }

      /* =====================================================
         ADMIN BOX
      ===================================================== */

      .admin-box {
        position: relative;

        margin-top: 34px;

        padding: 26px;

        border-radius: 21px;

        background:
          linear-gradient(
            135deg,
            rgba(232, 243, 254, 0.8),
            rgba(244, 249, 255, 0.55)
          );

        border: 1px solid rgba(58, 135, 216, 0.18);

        overflow: hidden;
      }

      body.dark .admin-box {
        background:
          linear-gradient(
            135deg,
            rgba(37, 107, 184, 0.14),
            rgba(16, 38, 60, 0.6)
          );
      }

      .admin-box::after {
        content: "";

        position: absolute;

        width: 180px;
        height: 180px;

        border-radius: 50%;

        background: rgba(93, 165, 232, 0.11);

        right: -80px;
        top: -90px;

        pointer-events: none;
      }

      .admin-box h3 {
        position: relative;
        z-index: 1;

        display: flex;
        align-items: center;
        gap: 9px;

        font-family: "Fraunces", serif;

        font-size: 22px;

        font-weight: 600;

        color: var(--ink);

        margin-bottom: 5px;
      }

      .admin-box h3 i {
        color: var(--blue-600);

        font-size: 17px;
      }

      .admin-box > p {
        position: relative;
        z-index: 1;

        color: var(--ink-soft);

        font-size: 13px;

        line-height: 1.6;

        margin-bottom: 23px;
      }

      /* =====================================================
         FORM
      ===================================================== */

      .form-group {
        position: relative;
        z-index: 1;

        margin-bottom: 19px;
      }

      .form-group label {
        display: block;

        font-family: "IBM Plex Mono", monospace;

        font-size: 10px;

        letter-spacing: 0.3px;

        font-weight: 600;

        color: var(--ink-soft);

        margin-bottom: 8px;
      }

      .form-group select,
      .form-group textarea {
        width: 100%;

        border: 1px solid var(--border);

        background: var(--card);

        color: var(--ink);

        border-radius: 13px;

        outline: none;

        font-family: inherit;

        transition:
          border-color 0.25s ease,
          box-shadow 0.25s ease,
          background 0.25s ease;
      }

      .form-group select {
        height: 49px;

        padding: 0 14px;

        cursor: pointer;
      }

      .form-group textarea {
        min-height: 155px;

        padding: 14px;

        resize: vertical;

        line-height: 1.65;

        font-size: 13px;
      }

      .form-group select:focus,
      .form-group textarea:focus {
        border-color: var(--blue-400);

        box-shadow:
          0 0 0 3px rgba(58, 135, 216, 0.1),
          var(--shadow-blue-sm);
      }

      .form-group select:hover,
      .form-group textarea:hover {
        border-color: rgba(58, 135, 216, 0.25);
      }

      /* =====================================================
         BUTTONS
      ===================================================== */

      .form-actions {
        position: relative;
        z-index: 1;

        display: flex;

        justify-content: flex-end;

        gap: 10px;

        margin-top: 23px;
      }

      .btn {
        border: 0;

        min-height: 45px;

        padding: 11px 18px;

        border-radius: 12px;

        font-family: inherit;

        font-size: 12px;

        font-weight: 700;

        cursor: pointer;

        transition:
          transform 0.25s ease,
          box-shadow 0.25s ease,
          background 0.25s ease;

        display: inline-flex;

        align-items: center;

        justify-content: center;

        gap: 8px;
      }

      .btn:disabled {
        opacity: 0.65;

        cursor: not-allowed;

        transform: none !important;
      }

      .btn-primary {
        color: white;

        background:
          linear-gradient(
            135deg,
            var(--blue-500),
            var(--blue-700)
          );

        box-shadow: var(--shadow-blue-sm);
      }

      .btn-primary:hover:not(:disabled) {
        transform: translateY(-2px);

        box-shadow: var(--shadow-blue);
      }

      .btn-secondary {
        background: var(--card);

        color: var(--ink-soft);

        border: 1px solid var(--border);
      }

      .btn-secondary:hover {
        background: var(--sky-100);

        color: var(--blue-700);

        transform: translateY(-2px);
      }

      /* =====================================================
         LOADING
      ===================================================== */

      .loading {
        padding: 80px 20px;

        text-align: center;

        color: var(--ink-soft);

        font-size: 13px;
      }

      .spinner {
        width: 38px;
        height: 38px;

        border: 3px solid rgba(58, 135, 216, 0.14);

        border-top-color: var(--blue-500);

        border-radius: 50%;

        animation: spin 0.8s linear infinite;

        margin: 0 auto 16px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* =====================================================
         ERROR
      ===================================================== */

      .error-box {
        padding: 65px 25px;

        text-align: center;
      }

      .error-icon {
        width: 68px;
        height: 68px;

        margin: 0 auto 20px;

        border-radius: 20px;

        display: flex;
        align-items: center;
        justify-content: center;

        background: #ffe8ec;

        color: #d43d4f;

        font-size: 24px;

        box-shadow: 0 12px 25px rgba(212, 61, 79, 0.12);
      }

      .error-box h2 {
        font-family: "Fraunces", serif;

        font-size: 25px;

        font-weight: 600;

        margin-bottom: 8px;
      }

      .error-box p {
        color: var(--ink-soft);

        font-size: 13px;

        line-height: 1.7;

        max-width: 500px;

        margin: 0 auto 22px;
      }

      /* =====================================================
         TOAST
      ===================================================== */

      .toast {
        position: fixed;

        right: 24px;
        bottom: 24px;

        z-index: 3000;

        max-width: 380px;

        padding: 14px 17px;

        border-radius: 14px;

        background: var(--blue-800);

        color: white;

        font-size: 12px;

        line-height: 1.5;

        box-shadow:
          0 15px 35px rgba(12, 49, 88, 0.25);

        transform: translateY(20px);

        opacity: 0;

        pointer-events: none;

        transition:
          transform 0.3s ease,
          opacity 0.3s ease;
      }

      .toast.show {
        transform: translateY(0);

        opacity: 1;
      }

      .toast.success {
        background: #138a58;
      }

      .toast.error {
        background: #c53d50;
      }

      /* =====================================================
         RESPONSIVE
      ===================================================== */

      @media (max-width: 1150px) {
        .topbar {
          left: 12px;
          right: 12px;
        }

        .chapters > a {
          padding-left: 9px;
          padding-right: 9px;

          font-size: 10px;
        }

        .chapters > a .n {
          display: none;
        }
      }

      @media (max-width: 980px) {
        .chapters {
          display: none;

          position: absolute;

          top: 76px;
          left: 0;
          right: 0;

          margin: 0;

          padding: 12px;

          flex-direction: column;

          align-items: stretch;

          gap: 4px;

          background: rgba(255, 255, 255, 0.96);

          border: 1px solid var(--border);

          border-radius: 19px;

          box-shadow: var(--shadow-blue);

          backdrop-filter: blur(18px);
        }

        body.dark .chapters {
          background: rgba(16, 38, 60, 0.97);
        }

        .chapters.show {
          display: flex;
        }

        .chapters > a {
          width: 100%;

          padding: 12px 14px;

          justify-content: flex-start;

          font-size: 12px;
        }

        .chapters > a .n {
          display: inline;
        }

        .nav-cta {
          margin-left: auto;
        }

        .menu-btn {
          display: flex;

          align-items: center;
          justify-content: center;

          margin-left: 5px;
        }
      }

      @media (max-width: 700px) {
        .topbar {
          height: 62px;

          top: 10px;
          left: 10px;
          right: 10px;

          padding: 7px 8px 7px 15px;

          border-radius: 18px;
        }

        .brand {
          font-size: 17px;
        }

        .brand small {
          font-size: 6px;
        }

        .nav-cta {
          padding: 10px 12px;

          font-size: 10px;
        }

        .theme-btn,
        .menu-btn {
          width: 36px;
          height: 36px;
        }

        .chapters {
          top: 70px;
        }

        .page {
          padding: 105px 16px 45px;
        }

        .page-header {
          margin-bottom: 24px;
        }

        .page-header h1 {
          font-size: 40px;

          letter-spacing: -1.5px;
        }

        .page-header p {
          font-size: 13px;
        }

        .card {
          border-radius: 19px;
        }

        .card-header {
          padding: 19px;

          align-items: flex-start;

          flex-direction: column;

          gap: 12px;
        }

        .card-header h2 {
          font-size: 19px;
        }

        .card-body {
          padding: 19px;
        }

        .info-grid {
          grid-template-columns: 1fr;

          gap: 11px;
        }

        .info-item {
          padding: 15px;
        }

        .admin-box {
          padding: 19px;

          border-radius: 17px;
        }

        .admin-box h3 {
          font-size: 20px;
        }

        .form-actions {
          flex-direction: column;
        }

        .btn {
          width: 100%;
        }

        .toast {
          left: 15px;
          right: 15px;
          bottom: 15px;

          max-width: none;
        }
      }

      @media (max-width: 430px) {
        .nav-cta {
          display: none;
        }

        .page-header h1 {
          font-size: 35px;
        }

        .breadcrumb {
          font-size: 9px;
        }

        .complaint-title {
          font-size: 23px;
        }
      }
    </style>
  </head>

  <body>
    <!-- =====================================================
         AMBIENT BACKGROUND
    ===================================================== -->

    <div class="ambient">
      <div class="ambient-grid"></div>
    </div>

    <!-- =====================================================
         NAVBAR
    ===================================================== -->

    <header class="topbar">
      <a href="index.html" class="brand">
        SEMPARUK
        <small>Kampung Halaman</small>
      </a>

      <nav class="chapters" id="chapters">
        <a href="index.html">
          <span class="n">01</span>
          Beranda
        </a>

        <a href="profil.html">
          <span class="n">02</span>
          Profil
        </a>

        <a href="galeri.html">
          <span class="n">03</span>
          Galeri
        </a>

        <a href="peta.html">
          <span class="n">04</span>
          Peta
        </a>

        <a href="kontak.html">
          <span class="n">05</span>
          Kontak
        </a>

        <a href="pengaduan.html" class="nav-complaint">
          <span class="n">06</span>
          Pengaduan
        </a>

        <a href="admin.html" class="nav-admin active">
          <span class="n">07</span>
          Admin 🔐
        </a>
      </nav>

      <button
        type="button"
        class="nav-cta"
        onclick="window.location.href='peta.html'"
      >
        Lihat Peta
        <span class="arrow">↗</span>
      </button>

      <button
        type="button"
        class="theme-btn"
        id="darkModeBtn"
        title="Mode Gelap"
        aria-label="Ubah mode warna"
      >
        <i class="fa-solid fa-moon"></i>
      </button>

      <button
        type="button"
        class="menu-btn"
        id="menuBtn"
        aria-label="Buka menu"
      >
        <i class="fa-solid fa-bars"></i>
      </button>
    </header>

    <!-- =====================================================
         MAIN
    ===================================================== -->

    <main class="page">
      <!-- BREADCRUMB -->

      <div class="breadcrumb">
        <a href="admin.html">
          Admin
        </a>

        <i class="fa-solid fa-chevron-right"></i>

        <span>
          Detail Pengaduan
        </span>
      </div>

      <!-- PAGE HEADER -->

      <div class="page-header">
        <div class="eyebrow">
          Panel Administrasi
        </div>

        <h1>
          Detail
          <span>Pengaduan</span>
        </h1>

        <p>
          Lihat informasi lengkap pengaduan warga, perbarui status,
          dan berikan tanggapan melalui panel administrasi.
        </p>
      </div>

      <!-- APP -->

      <div id="app">
        <div class="card">
          <div class="loading">
            <div class="spinner"></div>

            Memuat data pengaduan...
          </div>
        </div>
      </div>
    </main>

    <!-- TOAST -->

    <div class="toast" id="toast"></div>

    <!-- =====================================================
         JAVASCRIPT
    ===================================================== -->

    <script>
      /* =====================================================
         KONFIGURASI API
      ===================================================== */

      const API_URL =
        "https://script.google.com/macros/s/AKfycbweigKGIJxlnpFByo9EWOjoKm6jBz40XsMdqUSoGEY8jId5uw1I6D0JTRY6l2okatWseA/exec";

      /* =====================================================
         ELEMENT
      ===================================================== */

      const app = document.getElementById("app");

      const toast = document.getElementById("toast");

      /* =====================================================
         DARK MODE
      ===================================================== */

      const darkModeBtn =
        document.getElementById("darkModeBtn");

      if (localStorage.getItem("darkMode") === "true") {
        document.body.classList.add("dark");

        darkModeBtn.innerHTML =
          '<i class="fa-solid fa-sun"></i>';
      }

      darkModeBtn.addEventListener("click", function () {
        document.body.classList.toggle("dark");

        const dark =
          document.body.classList.contains("dark");

        localStorage.setItem("darkMode", dark);

        darkModeBtn.innerHTML = dark
          ? '<i class="fa-solid fa-sun"></i>'
          : '<i class="fa-solid fa-moon"></i>';
      });

      /* =====================================================
         MOBILE MENU
      ===================================================== */

      const menuBtn =
        document.getElementById("menuBtn");

      const navMenu =
        document.getElementById("chapters");

      menuBtn.addEventListener("click", function () {
        navMenu.classList.toggle("show");

        const isOpen =
          navMenu.classList.contains("show");

        menuBtn.innerHTML = isOpen
          ? '<i class="fa-solid fa-xmark"></i>'
          : '<i class="fa-solid fa-bars"></i>';
      });

      /* Tutup menu setelah memilih link */

      navMenu.querySelectorAll("a").forEach(function (link) {
        link.addEventListener("click", function () {
          navMenu.classList.remove("show");

          menuBtn.innerHTML =
            '<i class="fa-solid fa-bars"></i>';
        });
      });

      /* =====================================================
         TOAST
      ===================================================== */

      let toastTimer;

      function showToast(
        message,
        type = "success"
      ) {
        toast.textContent = message;

        toast.className =
          "toast show " + type;

        clearTimeout(toastTimer);

        toastTimer = setTimeout(function () {
          toast.className = "toast";
        }, 3000);
      }

      /* =====================================================
         ESCAPE HTML
      ===================================================== */

      function escapeHTML(value) {
        if (
          value === null ||
          value === undefined
        ) {
          return "";
        }

        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      /* =====================================================
         GET ID DARI URL
      ===================================================== */

      const params =
        new URLSearchParams(
          window.location.search
        );

      const complaintId =
        params.get("id");

      /* =====================================================
         VALIDASI ID
      ===================================================== */

      if (!complaintId) {
        showError(
          "ID pengaduan tidak ditemukan.",
          "URL halaman tidak memiliki ID pengaduan."
        );
      } else {
        loadComplaint();
      }

      /* =====================================================
         LOAD DETAIL
      ===================================================== */

      function loadComplaint() {
        requestJSONP(
          {
            action: "detail",
            id: complaintId,
          },

          function (response) {
            try {
              if (
                response &&
                response.success &&
                response.data
              ) {
                renderComplaint(
                  response.data
                );
              } else {
                showError(
                  "Pengaduan tidak ditemukan.",
                  response?.message ||
                    "Data tidak tersedia."
                );
              }
            } catch (error) {
              console.error(error);

              showError(
                "Terjadi kesalahan.",
                "Data pengaduan tidak dapat diproses."
              );
            }
          },

          function () {
            showError(
              "Google Apps Script sedang lambat.",
              "Silakan muat ulang halaman beberapa saat lagi."
            );
          },

          3
        );
      }

      /* =====================================================
         JSONP DENGAN TIMEOUT + RETRY
      ===================================================== */

      function requestJSONP(
        params,
        onSuccess,
        onError,
        maxRetries
      ) {
        maxRetries =
          maxRetries || 3;

        let attempt = 0;

        function run() {
          attempt++;

          const callbackName =
            "detailJSONP_" +
            Date.now() +
            "_" +
            Math.random()
              .toString(36)
              .substring(2, 8);

          const script =
            document.createElement(
              "script"
            );

          let finished = false;

          function cleanup() {
            clearTimeout(timeout);

            if (script.parentNode) {
              script.parentNode.removeChild(
                script
              );
            }

            delete window[
              callbackName
            ];
          }

          function fail() {
            if (finished) return;

            finished = true;

            cleanup();

            if (
              attempt < maxRetries
            ) {
              setTimeout(
                run,
                700 * attempt
              );
            } else {
              onError(
                new Error(
                  "Google Apps Script tidak merespons."
                )
              );
            }
          }

          const timeout =
            setTimeout(
              fail,
              8000
            );

          window[
            callbackName
          ] = function (response) {
            if (finished) return;

            finished = true;

            cleanup();

            onSuccess(response);
          };

          const query =
            new URLSearchParams();

          Object.keys(params).forEach(
            function (key) {
              query.append(
                key,
                params[key]
              );
            }
          );

          query.append(
            "callback",
            callbackName
          );

          query.append(
            "_",
            Date.now()
          );

          script.src =
            API_URL +
            "?" +
            query.toString();

          script.onerror = fail;

          document.body.appendChild(
            script
          );
        }

        run();
      }

      /* =====================================================
         RENDER DETAIL
      ===================================================== */

      function renderComplaint(data) {
        const status =
          String(
            data.status || "baru"
          ).toLowerCase();

        let statusClass =
          "status-baru";

        if (
          status === "diproses"
        ) {
          statusClass =
            "status-diproses";
        }

        if (
          status === "selesai"
        ) {
          statusClass =
            "status-selesai";
        }

        if (
          status === "ditolak"
        ) {
          statusClass =
            "status-ditolak";
        }

        const kontak =
          escapeHTML(
            data.kontak || "-"
          );

        app.innerHTML = `

          <div class="card">

            <!-- CARD HEADER -->

            <div class="card-header">

              <div>
                <h2>
                  Pengaduan
                  <span>
                    ${escapeHTML(
                      data.kode || "-"
                    )}
                  </span>
                </h2>
              </div>

              <span
                class="status ${statusClass}">
                ${escapeHTML(status)}
              </span>

            </div>

            <!-- CARD BODY -->

            <div class="card-body">

              <!-- INFORMASI -->

              <div class="info-grid">

                <div class="info-item">

                  <div class="info-label">
                    Kode Pengaduan
                  </div>

                  <div class="info-value">
                    ${escapeHTML(
                      data.kode || "-"
                    )}
                  </div>

                </div>

                <div class="info-item">

                  <div class="info-label">
                    Nama Warga
                  </div>

                  <div class="info-value">
                    ${escapeHTML(
                      data.nama || "-"
                    )}
                  </div>

                </div>

                <div class="info-item">

                  <div class="info-label">
                    Kontak
                  </div>

                  <div class="info-value">

                    ${
                      data.kontak
                        ? `
                          <a
                            href="tel:${escapeHTML(
                              data.kontak
                            )}">
                            ${kontak}
                          </a>
                        `
                        : "-"
                    }

                  </div>

                </div>

                <div class="info-item">

                  <div class="info-label">
                    Kategori
                  </div>

                  <div class="info-value">
                    ${escapeHTML(
                      data.kategori || "-"
                    )}
                  </div>

                </div>

                <div class="info-item">

                  <div class="info-label">
                    Tanggal Pengaduan
                  </div>

                  <div class="info-value">
                    ${escapeHTML(
                      data.tanggal || "-"
                    )}
                  </div>

                </div>

                <div class="info-item">

                  <div class="info-label">
                    Terakhir Diperbarui
                  </div>

                  <div class="info-value">
                    ${escapeHTML(
                      data.diperbarui || "-"
                    )}
                  </div>

                </div>

              </div>

              <!-- LOKASI -->

              <div class="content-section">

                <div class="section-title">

                  <i class="fa-solid fa-location-dot"></i>

                  Lokasi Kejadian

                </div>

                <div class="location">

                  <i class="fa-solid fa-location-dot"></i>

                  <span>
                    ${escapeHTML(
                      data.lokasi ||
                        "Lokasi tidak dicantumkan."
                    )}
                  </span>

                </div>

              </div>

              <!-- JUDUL -->

              <div class="content-section">

                <div class="section-title">

                  <i class="fa-solid fa-file-lines"></i>

                  Judul Pengaduan

                </div>

                <div class="complaint-title">

                  ${escapeHTML(
                    data.judul || "-"
                  )}

                </div>

              </div>

              <!-- ISI -->

              <div class="content-section">

                <div class="section-title">

                  <i class="fa-solid fa-align-left"></i>

                  Isi Pengaduan

                </div>

                <div class="complaint-content">

                  ${escapeHTML(
                    data.isi || "-"
                  )}

                </div>

              </div>

              <!-- ADMIN -->

              <div class="admin-box">

                <h3>
                  <i class="fa-solid fa-user-shield"></i>
                  Tindakan Admin
                </h3>

                <p>
                  Perbarui status dan berikan
                  tanggapan kepada warga.
                </p>

                <div class="form-group">

                  <label for="status">
                    Status Pengaduan
                  </label>

                  <select id="status">

                    <option
                      value="baru"
                      ${
                        status === "baru"
                          ? "selected"
                          : ""
                      }>
                      Baru
                    </option>

                    <option
                      value="diproses"
                      ${
                        status === "diproses"
                          ? "selected"
                          : ""
                      }>
                      Diproses
                    </option>

                    <option
                      value="selesai"
                      ${
                        status === "selesai"
                          ? "selected"
                          : ""
                      }>
                      Selesai
                    </option>

                    <option
                      value="ditolak"
                      ${
                        status === "ditolak"
                          ? "selected"
                          : ""
                      }>
                      Ditolak
                    </option>

                  </select>

                </div>

                <div class="form-group">

                  <label for="tanggapan">
                    Tanggapan Admin
                  </label>

                  <textarea
                    id="tanggapan"
                    placeholder="Tulis tanggapan untuk warga..."
                  >${escapeHTML(
                    data.tanggapan || ""
                  )}</textarea>

                </div>

                <div class="form-actions">

                  <button
                    class="btn btn-secondary"
                    onclick="window.location.href='admin.html'">

                    <i class="fa-solid fa-arrow-left"></i>

                    Kembali

                  </button>

                  <button
                    class="btn btn-primary"
                    id="saveBtn"
                    onclick="updateComplaint()">

                    <i class="fa-solid fa-floppy-disk"></i>

                    Simpan Perubahan

                  </button>

                </div>

              </div>

            </div>

          </div>

        `;
      }

      /* =====================================================
         UPDATE PENGADUAN
      ===================================================== */

      function updateComplaint() {
        const status =
          document.getElementById(
            "status"
          ).value;

        const tanggapan =
          document.getElementById(
            "tanggapan"
          ).value;

        const saveBtn =
          document.getElementById(
            "saveBtn"
          );

        saveBtn.disabled = true;

        saveBtn.innerHTML = `
          <i class="fa-solid fa-spinner fa-spin"></i>
          Menyimpan...
        `;

        const formData =
          new URLSearchParams();

        formData.append(
          "action",
          "update"
        );

        formData.append(
          "id",
          complaintId
        );

        formData.append(
          "status",
          status
        );

        formData.append(
          "tanggapan",
          tanggapan
        );

        fetch(API_URL, {
          method: "POST",

          mode: "no-cors",

          headers: {
            "Content-Type":
              "application/x-www-form-urlencoded",
          },

          body:
            formData.toString(),
        })
          .then(function () {
            verifyUpdate(
              status,
              tanggapan,
              0
            );
          })

          .catch(function (error) {
            console.error(error);

            finishUpdateError(
              "Gagal mengirim perubahan. Silakan coba lagi."
            );
          });
      }

      /* =====================================================
         VERIFIKASI UPDATE
      ===================================================== */

      function verifyUpdate(
        expectedStatus,
        expectedResponse,
        attempt
      ) {
        requestJSONP(
          {
            action: "detail",
            id: complaintId,
          },

          function (response) {
            if (
              response &&
              response.success &&
              response.data
            ) {
              const currentStatus =
                String(
                  response.data.status ||
                    ""
                ).toLowerCase();

              const currentResponse =
                String(
                  response.data
                    .tanggapan || ""
                );

              if (
                currentStatus ===
                  String(
                    expectedStatus
                  ).toLowerCase() &&
                currentResponse ===
                  String(
                    expectedResponse
                  )
              ) {
                showToast(
                  "Perubahan berhasil disimpan.",
                  "success"
                );

                setTimeout(
                  function () {
                    window.location.href =
                      "admin.html";
                  },
                  900
                );

                return;
              }
            }

            if (attempt < 2) {
              setTimeout(
                function () {
                  verifyUpdate(
                    expectedStatus,
                    expectedResponse,
                    attempt + 1
                  );
                },
                1000
              );

              return;
            }

            finishUpdateError(
              "Perubahan belum dapat diverifikasi. Jangan klik Simpan berulang kali; periksa kembali beberapa detik lagi."
            );
          },

          function () {
            if (attempt < 2) {
              setTimeout(
                function () {
                  verifyUpdate(
                    expectedStatus,
                    expectedResponse,
                    attempt + 1
                  );
                },
                1200
              );

              return;
            }

            finishUpdateError(
              "Server Google sedang lambat. Perubahan mungkin sudah tersimpan. Jangan klik Simpan berulang kali."
            );
          },

          3
        );
      }

      /* =====================================================
         UPDATE ERROR
      ===================================================== */

      function finishUpdateError(
        message
      ) {
        const saveBtn =
          document.getElementById(
            "saveBtn"
          );

        if (saveBtn) {
          saveBtn.disabled = false;

          saveBtn.innerHTML = `
            <i class="fa-solid fa-floppy-disk"></i>
            Simpan Perubahan
          `;
        }

        showToast(
          message,
          "error"
        );
      }

      /* =====================================================
         ERROR PAGE
      ===================================================== */

      function showError(
        title,
        message
      ) {
        app.innerHTML = `

          <div class="card">

            <div class="error-box">

              <div class="error-icon">

                <i class="fa-solid fa-circle-exclamation"></i>

              </div>

              <h2>
                ${escapeHTML(title)}
              </h2>

              <p>
                ${escapeHTML(message)}
              </p>

              <button
                class="btn btn-primary"
                onclick="window.location.href='admin.html'">

                <i class="fa-solid fa-arrow-left"></i>

                Kembali ke Admin

              </button>

            </div>

          </div>

        `;
      }
    </script>
